<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Coro Patry</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #000;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

button {
  border: none;
  border-radius: 18px;
  background: #f0f0f0;
  color: #111;
  font-weight: bold;
  cursor: pointer;
}

/* PANTALLAS */
#homeScreen,
#songsScreen,
#lyricsScreen {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100vh;
  background: #000;
}

/* INICIO */
#homeScreen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  z-index: 30;
}

#homeScreen h1 {
  font-size: 42px;
  margin-bottom: 45px;
}

.home-btn {
  font-size: 34px;
  padding: 24px 50px;
  border-radius: 26px;
  display: block;
margin: 0 auto;
}

/* LISTA CANCIONES */
#songsScreen {
  display: none;
  text-align: center;
  padding: 45px 20px 160px;
  overflow-y: auto;
}

#songsScreen h2 {
  font-size: 42px;
  margin: 0 0 25px;
}

.song-btn {
  display: block;
  width: 92%;
  max-width: 540px;
  margin: 18px auto;
  padding: 24px 18px;
  font-size: 28px;
  border-radius: 24px;
  line-height: 1.25;
}

/* BOTONES VOLVER */
.back-btn {
  font-size: 22px;
  padding: 12px 24px;
  border-radius: 18px;
  margin-bottom: 24px;
}

/* PANTALLA LETRA */
#lyricsScreen {
  display: none;
  z-index: 10;
  overflow: hidden;
  padding-bottom: 125px;
}

.lyrics-top {
  height: 78px;
  background: #111;
  border-bottom: 1px solid #333;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.lyrics-top .back-btn {
  position: absolute;
  left: 10px;
  top: 12px;
  margin: 0;
  font-size: 18px;
  padding: 10px 16px;
}

.lyrics-title {
  font-size: 24px;
  font-weight: bold;
  padding-left: 115px;
  padding-right: 10px;
}

#lyricsWindow {
  height: calc(100vh - 205px);
  overflow: hidden;
  padding: 35px 18px 20px;
}

#lyrics {
  font-size: 42px;
  line-height: 1.6;
  text-align: center;
  white-space: pre-wrap;
  transform: translateY(0px);
  will-change: transform;
}

/* CONTROLES */
.controls {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  height: 125px;
  padding: 10px 8px calc(10px + env(safe-area-inset-bottom));
  background: #111;
  border-top: 1px solid #333;
  display: flex;
  align-items: center;
  justify-content: space-around;
  gap: 8px;
  z-index: 50;
}

.control-btn {
  width: 82px;
  height: 82px;
  font-size: 38px;
  border-radius: 24px;
  padding: 0;
}

.speed {
  min-width: 62px;
  text-align: center;
  color: white;
  font-size: 24px;
  font-weight: bold;
  line-height: 1.2;
}

@media (max-width: 430px) {
  #homeScreen h1 {
    font-size: 38px;
  }

  .home-btn {
    font-size: 30px;
    padding: 22px 42px;
  }

  #songsScreen h2 {
    font-size: 38px;
  }

  .song-btn {
    font-size: 25px;
    padding: 22px 14px;
  }

  #lyrics {
    font-size: 40px;
  }

  .control-btn {
    width: 78px;
    height: 78px;
    font-size: 34px;
  }

  .lyrics-title {
    font-size: 22px;
  }
}
</style>
</head>

<body>

<!-- PANTALLA INICIO -->
<div id="homeScreen">

  width: 95%;
  max-width: 500px;
  margin-bottom: 50px;
">

<button class="home-btn" onclick="irCanciones()" style="

  padding: 26px 50px;

</button>

<div style="

  color: #FFD700;

<!-- PANTALLA LISTA CANCIONES -->

<button class="song-btn" onclick="cargarCancion('LET IT BE')">

</button>

<button class="song-btn" onclick="cargarCancion('CANCIÓN 3')">

<button class="song-btn" onclick="cargarCancion('CANCIÓN 4')">

</div>
  

<!-- PANTALLA LETRAS -->
<div id="lyricsScreen">

    <button class="back-btn" onclick="volverCanciones()">⬅️ Volver</button>
    <div class="lyrics-title">🎤 Teleprompter Coro</div>

  <div id="lyricsWindow">

  </div>

  <div class="controls">
    <button class="control-btn" onclick="togglePlay()">▶️</button>
    <button class="control-btn" onclick="slower()">➖</button>
    <div class="speed">Vel:<br><span id="speedText">1</span></div>
    <button class="control-btn" onclick="faster()">➕</button>
    <button class="control-btn" onclick="resetScroll()">🔄</button>

</div>

function irCanciones() {
  homeScreen.style.display = "none";
  songsScreen.style.display = "block";
  lyricsScreen.style.display = "none";
}

function volverHome() {
  songsScreen.style.display = "none";
  lyricsScreen.style.display = "none";
  homeScreen.style.display = "flex";
  resetScroll();
}

function volverCanciones() {
  lyricsScreen.style.display = "none";
  songsScreen.style.display = "block";
  homeScreen.style.display = "none";
  resetScroll();
}

function cargarCancion(nombre) {
  const texto = canciones[nombre] || "SIN LETRA";
  lyrics.textContent = texto;

  homeScreen.style.display = "none";
  songsScreen.style.display = "none";
  lyricsScreen.style.display = "block";

  resetScroll();
}

function togglePlay() {
  playing = !playing;
}

function faster() {
  speed += 0.5;
  speedText.textContent = speed;
}

function slower() {
  if (speed > 0.5) {
    speed -= 0.5;
    speedText.textContent = speed;
  }
}

function resetScroll() {
  playing = false;
  position = 0;
  lyrics.style.transform = "translateY(0px)";
}

function scrollText() {
  if (playing) {
    position -= speed * 0.35;
    lyrics.style.transform = `translateY(${position}px)`;
  }
  requestAnimationFrame(scrollText);
}

scrollText();
