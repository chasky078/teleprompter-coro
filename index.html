<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teleprompter Coro</title>
  <style>
    body {
      margin: 0;
      background: #050505;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    header {
      height: 60px;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
      border-bottom: 1px solid #333;
    }

    #screen {
      height: calc(100vh - 200px);
      overflow: hidden;
      padding: 30px;
      box-sizing: border-box;
    }

    #lyrics {
      font-size: 36px;
      line-height: 1.6;
      text-align: center;
      white-space: pre-wrap;
      transform: translateY(0px);
    }

    .controls {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 110px;
  background: #111;
  display: flex;
  align-items: center;
  justify-content: space-around;
  border-top: 1px solid #333;
  padding: 10px;
  box-sizing: border-box;
    }
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      border-top: 1px solid #333;
    }

    button {
  font-size: 30px;
  padding: 18px;
  border: none;
  border-radius: 16px;
  background: #ffffff;
  color: #111;
  font-weight: bold;
  width: 70px;
  height: 70px;
      }
.controls .control-btn {
  font-size: 40px;
  width: 100px;
  height: 100px;
  border-radius: 24px;
}
}
    .speed {
  font-size: 24px;
  color: white;
    }
  </style>
</head>
<body>

  <header>🎤 Teleprompter Coro</header>
  <div id="homeScreen" style="
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100vh;
  background: #000;
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 999;
  text-align: center;
">
  <h1 style="font-size: 32px; margin-bottom: 30px;">🎤 Coro Patry</h1>

  <button onclick="irACanciones()" style="
    font-size: 28px;
    padding: 20px 40px;
    border-radius: 20px;
  ">
    CANCIONES
  </button>
  </div>

  <div id="screen">
    <div id="lyrics">
Pega aquí la letra de la canción.

Esta es la primera línea.
Esta es la segunda línea.
Esta es la tercera línea.

Pulsa PLAY y el texto bajará solo.
    </div>
  </div>

  <div class="controls">
  <button class="control-btn" onclick="togglePlay()">▶️</button>
  <button class="control-btn" onclick="slower()">➖</button>
  <div class="speed">Vel: <span id="speedText">1</span></div>
  <button class="control-btn" onclick="faster()">➕</button>
  <button class="control-btn" onclick="resetScroll()">↩️</button>
  </div>

  <script>
    let playing = false;
    let speed = 1;
    let position = 0;

    const lyrics = document.getElementById("lyrics");
    const speedText = document.getElementById("speedText");
    const canciones = {
  "ERES TÚ / MOCEDADES": `Tú eres como el agua de mi fuente
Tú eres el fuego de mi hogar

Como una promesa, eres tú, eres tú
Como una mañana de verano
Como una sonrisa, eres tú, eres tú
Así, así, eres tú
Toda mi esperanza, eres tú, eres tú
Como lluvia fresca en mis manos
Como fuerte brisa, eres tú, eres tú
Así, así, eres tú
Eres tú
Como el agua de mi fuente
Eres tú
El fuego de mi hogar
Algo así eres tú
Algo así como el fuego de mi hoguera
(Eres tú) Algo así eres tú
Mi vida algo así eres tú
Como mi poema, eres tú, eres tú (Uh, eres tú)
Como una guitarra en la noche
Todo mi horizonte, eres tú, eres tú (Ah, ah, ah)
Así, así, eres tú (Eres tú)
Na, na, na, na
Na, na, na, na
Eres tú
Como el agua de mi fuente
Eres tú
El fuego de mi hogar
Algo así eres tú
Algo así como el fuego de mi hoguera
Algo así eres tú, uuuuuh (Eres tú)
Mi vida algo así eres tú
Algo así eres tú
Algo así como el agua de mi fuente (Como el agua de mi fuente)
Eres tú
El fuego de mi hogar`
};

    function scrollText() {
      if (playing) {
        position -= speed * 0.35;
        lyrics.style.transform = `translateY(${position}px)`;
      }
      requestAnimationFrame(scrollText);
    }

    function togglePlay() {
      playing = !playing;
    }

    function faster() {
      speed++;
      speedText.textContent = speed;
    }

    function slower() {
      if (speed > 1) {
        speed--;
        speedText.textContent = speed;
      }
    }

    function resetScroll() {
      playing = false;
      position = 0;
      lyrics.style.transform = "translateY(0px)";
    }

    
    function loadText() {
  const text = document.getElementById("inputText").value;
  lyrics.textContent = text;
  resetScroll();
    }
    function cargarCancion(nombre) {
  const texto = canciones[nombre];
  lyrics.textContent = texto;
  resetScroll();

  alert("🎵 Cargada: " + nombre);
}
    function irACanciones() {
  document.getElementById("homeScreen").style.display = "none";
    }
    scrollText();
  </script>

</body>
</html>
