<!DOCTYPE html>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #000;
  color: white;
  font-family: Arial, sans-serif;
}

/* PANTALLAS */
#homeScreen, #songsScreen, #lyricsScreen {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100vh;
  background: #000;
}

/* HOME */
#homeScreen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

#homeScreen h1 {
  font-size: 40px;
  margin-bottom: 40px;
}

/* BOTONES GENERALES */
button {
  border: none;
  border-radius: 18px;
  background: #f0f0f0;
  color: #111;
  font-weight: bold;
  cursor: pointer;
}

/* BOTÓN HOME */
.home-btn {
  font-size: 32px;
  padding: 20px 40px;
}

/* PANTALLA CANCIONES */
#songsScreen {
  display: none;
  text-align: center;
  padding-top: 40px;
}

.song-btn {
  display: block;
  width: 85%;
  max-width: 500px;
  margin: 20px auto;
  font-size: 26px;
  padding: 20px;
}

/* BOTÓN VOLVER */
.back-btn {
  margin: 10px;
  padding: 10px 20px;
  font-size: 18px;
}

/* LETRAS */
#lyricsScreen {
  display: none;
}

header {
  text-align: center;
  font-size: 22px;
  padding: 10px;
}

#lyricsWindow {
  height: calc(100vh - 150px);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

#lyrics {
  font-size: 40px;
  text-align: center;
  line-height: 1.6;
  padding: 20px;
}

/* CONTROLES */
.controls {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #111;
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 10px;
}

.control-btn {
  font-size: 24px;
  padding: 15px;
}

.speed {
  font-size: 20px;
  text-align: center;
}
</style>
</head>

<!-- HOME -->
<div id="homeScreen">

  <button class="home-btn" onclick="irCanciones()">CANCIONES</button>
</div>

<!-- LISTA CANCIONES -->
<div id="songsScreen">

  <button class="song-btn" onclick="cargarCancion('LOS LOCOS / NUBES DE TORMENTA')">🎵 LOS LOCOS / NUBES DE TORMENTA</button>

  <button class="song-btn" onclick="cargarCancion('500 MILES / THE PROCLAIMERS')">🎵 500 MILES / THE PROCLAIMERS</button>

<!-- LETRAS -->

    <button class="control-btn" onclick="faster()">➕</button>
    <button class="control-btn" onclick="resetScroll()">🔄</button>

/* NAVEGACIÓN */
function irCanciones() {
  homeScreen.style.display = "none";
  songsScreen.style.display = "block";
}

function volverHome() {
  songsScreen.style.display = "none";
  homeScreen.style.display = "flex";
}

function volverCanciones() {
  lyricsScreen.style.display = "none";
  songsScreen.style.display = "block";
  resetScroll();
}

/* CARGAR CANCIÓN */
function cargarCancion(nombre) {
  songsScreen.style.display = "none";
  lyricsScreen.style.display = "block";
  lyricsDiv.innerText = canciones[nombre] || "SIN LETRA";
}

/* CONTROLES */
function togglePlay() {
  playing = !playing;
  if (playing) {
    interval = setInterval(() => {
      lyricsWindow.scrollTop += speed;
    }, 50);
  } else {
    clearInterval(interval);
  }
}

function slower() {
  if (speed > 0.5) speed -= 0.5;
  speedText.innerText = speed;
}

function faster() {
  speed += 0.5;
  speedText.innerText = speed;
}

function resetScroll() {
  lyricsWindow.scrollTop = 0;
}
