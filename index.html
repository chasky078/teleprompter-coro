<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Coro Patry</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #000;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

button {
  border: none;
  border-radius: 18px;
  background: #f0f0f0;
  color: #111;
  font-weight: bold;
  cursor: pointer;
}

#homeScreen,
#songsScreen,
#lyricsScreen {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100vh;
  background: #000;
}

#homeScreen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px;
}

#homeScreen h1 {
  font-size: 42px;
  margin: 0 0 40px;
}

.home-btn {
  font-size: 32px;
  padding: 22px 46px;
  border-radius: 24px;
  min-width: 260px;
}

#songsScreen {
  display: none;
  text-align: center;
  padding: 42px 18px 30px;
  overflow-y: auto;
}

#songsScreen h2 {
  font-size: 38px;
  margin: 0 0 22px;
}

.back-btn {
  display: inline-block;
  font-size: 24px;
  padding: 14px 28px;
  border-radius: 18px;
  margin: 0 auto 26px;
}

.song-btn {
  display: block;
  width: 92%;
  max-width: 540px;
  margin: 0 auto 18px;
  font-size: 27px;
  padding: 22px 16px;
  border-radius: 22px;
  line-height: 1.2;
}

#lyricsScreen {
  display: none;
  overflow: hidden;
  padding-bottom: 120px;
}

.lyrics-top {
  height: 82px;
  background: #111;
  border-bottom: 1px solid #333;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
}

.lyrics-top .back-btn {
  margin: 0;
  font-size: 19px;
  padding: 11px 16px;
  flex: 0 0 auto;
}

.lyrics-title {
  flex: 1;
  text-align: center;
  font-size: 24px;
  font-weight: bold;
  padding-right: 84px;
}

#lyricsWindow {
  height: calc(100vh - 212px);
  overflow: hidden;
  padding: 28px 22px 20px;
}

#lyrics {
  font-size: 42px;
  line-height: 1.55;
  text-align: center;
  white-space: pre-wrap;
  transform: translateY(0px);
  will-change: transform;
}

.controls {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  height: 130px;
  padding: 12px 10px calc(12px + env(safe-area-inset-bottom));
  background: #111;
  border-top: 1px solid #333;
  display: flex;
  align-items: center;
  justify-content: space-around;
  gap: 8px;
}

.control-btn {
  width: 84px;
  height: 84px;
  font-size: 38px;
  border-radius: 24px;
  padding: 0;
}

.speed {
  min-width: 68px;
  text-align: center;
  color: white;
  font-size: 24px;
  font-weight: bold;
  line-height: 1.2;
}

@media (max-width: 430px) {
  #homeScreen h1 {
    font-size: 38px;
  }

  .home-btn {
    font-size: 30px;
  }

  #songsScreen h2 {
    font-size: 34px;
  }

  .song-btn {
    font-size: 24px;
    padding: 20px 14px;
  }

  #lyrics {
    font-size: 38px;
  }

  .control-btn {
    width: 78px;
    height: 78px;
    font-size: 34px;
  }

  .speed {
    font-size: 22px;
  }
}
</style>
</head>

  <button class="home-btn" onclick="irCanciones()">CANCIONES</button>
</div>

<div id="songsScreen">

  <button class="back-btn" onclick="volverHome()">⬅️ Volver</button>

<div id="lyricsScreen">

  <div id="lyricsWindow">

function irCanciones() {
  homeScreen.style.display = "none";
  songsScreen.style.display = "block";
  lyricsScreen.style.display = "none";
}

function volverHome() {
  songsScreen.style.display = "none";
  lyricsScreen.style.display = "none";
  homeScreen.style.display = "flex";
  resetScroll();
}

function volverCanciones() {
  lyricsScreen.style.display = "none";
  songsScreen.style.display = "block";
  resetScroll();
}

function cargarCancion(nombre) {
  const texto = canciones[nombre] || "SIN LETRA";
  lyrics.textContent = texto;
  songsScreen.style.display = "none";
  homeScreen.style.display = "none";
  lyricsScreen.style.display = "block";
  resetScroll();
}

function togglePlay() {
  playing = !playing;
}

function faster() {
  speed += 0.5;
  speedText.textContent = speed;
}

function slower() {
  if (speed > 0.5) {
    speed -= 0.5;
    speedText.textContent = speed;
  }
}

function resetScroll() {
  playing = false;
  position = 0;
  lyrics.style.transform = "translateY(0px)";
}

function scrollText() {
  if (playing) {
    position -= speed * 0.35;
    lyrics.style.transform = `translateY(${position}px)`;
  }
  requestAnimationFrame(scrollText);
}

scrollText();

</html>
