<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Coro Patry</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    button {
      border: none;
      border-radius: 18px;
      background: #f0f0f0;
      color: #111;
      font-weight: bold;
      cursor: pointer;
    }
    #homeScreen, #songsScreen, #screen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      background: #000;
    }
    #homeScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 30;
    }
    #homeScreen h1 {
      font-size: 40px;
      margin-bottom: 40px;
    }
    .home-btn {
      font-size: 32px;
      padding: 24px 50px;
      border-radius: 24px;
      min-width: 280px;
    }
    #songsScreen {
      display: none;
      z-index: 20;
      padding: 45px 20px 150px;
      text-align: center;
      overflow-y: auto;
    }
    #songsScreen h2 {
      font-size: 38px;
      margin: 0 0 30px;
    }
    .song-btn {
      display: block;
      width: 92%;
      max-width: 520px;
      margin: 0 auto 18px;
      padding: 22px 16px;
      font-size: 28px;
      border-radius: 22px;
      text-align: center;
    }
    #screen {
      display: none;
      z-index: 10;
      overflow: hidden;
      padding-bottom: 130px;
    }
    header {
      height: 70px;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
      border-bottom: 1px solid #333;
    }
    #lyricsWindow {
      height: calc(100vh - 200px);
      overflow: hidden;
      padding: 35px 22px 20px;
    }
    #lyrics {
      font-size: 46px;
      line-height: 1.55;
      text-align: center;
      white-space: pre-wrap;
      transform: translateY(0px);
      will-change: transform;
    }
    .controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 130px;
      padding: 12px 10px calc(12px + env(safe-area-inset-bottom));
      background: #111;
      border-top: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 8px;
      z-index: 50;
    }
    .control-btn {
      width: 92px;
      height: 92px;
      font-size: 42px;
      border-radius: 24px;
      padding: 0;
    }
    .speed {
      min-width: 70px;
      text-align: center;
      color: white;
      font-size: 26px;
      font-weight: bold;
      line-height: 1.2;
    }
    @media (max-width: 430px) {
      #lyrics { font-size: 42px; }
      .song-btn { font-size: 25px; }
      .control-btn { width: 84px; height: 84px; font-size: 38px; }
    }
  </style>
</head>
<body>
  <div id="homeScreen">
    <h1>🎤 Coro Patry</h1>
    <button class="home-btn" onclick="irACanciones()">CANCIONES</button>
  </div>

  <div id="songsScreen">
    <h2>📚 Canciones</h2>
    <button onclick="document.getElementById('songsScreen').style.display='none'; document.getElementById('homeScreen').style.display='flex';">
⬅️ Volver
    </button>
    <button class="song-btn" onclick="cargarCancion('ERES TÚ / MOCEDADES')">🎵 ERES TÚ / MOCEDADES</button>
    <button class="song-btn" onclick="cargarCancion('MEJOR / LOS BRINCOS')">🎵 MEJOR / LOS BRINCOS</button>
    <button class="song-btn" onclick="cargarCancion('LOS LOCOS / NUBES DE TORMENTA')">🎵 LOS LOCOS / NUBES DE TORMENTA</button>
  </div>

  <div id="screen">
    <header>🎤 Teleprompter Coro</header>
    <div id="lyricsWindow">
      <div id="lyrics"></div>
    </div>
    <div class="controls">
      <button class="control-btn" onclick="togglePlay()">▶️</button>
      <button class="control-btn" onclick="slower()">➖</button>
      <div class="speed">Vel:<br><span id="speedText">1</span></div>
      <button class="control-btn" onclick="faster()">➕</button>
      <button class="control-btn" onclick="resetScroll()">↩️</button>
    </div>
  </div>

  <script>
    let playing = false;
    let speed = 1;
    let position = 0;

    const lyrics = document.getElementById("lyrics");
    const speedText = document.getElementById("speedText");
    const homeScreen = document.getElementById("homeScreen");
    const songsScreen = document.getElementById("songsScreen");
    const screen = document.getElementById("screen");

    const canciones = {
      "ERES TÚ / MOCEDADES": "Tú eres como el agua de mi fuente\nTú eres el fuego de mi hogar\n\nComo una promesa, eres tú, eres tú\nComo una mañana de verano\nComo una sonrisa, eres tú, eres tú\nAsí, así, eres tú\nToda mi esperanza, eres tú, eres tú\nComo lluvia fresca en mis manos\nComo fuerte brisa, eres tú, eres tú\nAsí, así, eres tú\nEres tú\nComo el agua de mi fuente\nEres tú\nEl fuego de mi hogar\nAlgo así eres tú\nAlgo así como el fuego de mi hoguera\n(Eres tú) Algo así eres tú\nMi vida algo así eres tú\nComo mi poema, eres tú, eres tú (Uh, eres tú)\nComo una guitarra en la noche\nTodo mi horizonte, eres tú, eres tú (Ah, ah, ah)\nAsí, así, eres tú (Eres tú)\nNa, na, na, na\nNa, na, na, na\nEres tú\nComo el agua de mi fuente\nEres tú\nEl fuego de mi hogar\nAlgo así eres tú\nAlgo así como el fuego de mi hoguera\nAlgo así eres tú, uuuuuh (Eres tú)\nMi vida algo así eres tú\nAlgo así eres tú\nAlgo así como el agua de mi fuente (Como el agua de mi fuente)\nEres tú\nEl fuego de mi hogar",
      "MEJOR / LOS BRINCOS": "Mejor era cuando decías\nQue también me querías\nAhora todo pasó (ya)\nMejor era cuando pensabas\nQue me necesitabas\nAhora todo pasó (ya)\nY tú, tú\nTú ya no eres igual\nNo me digas que sí\nNo sé lo que pensar\nNo sé lo que decir\nMejor era cuando creía\nQue tú me comprendías\nAhora veo que no (no)\nMejor era cuando creía\nQue tú no me mentías\nAhora veo que sí (yo)\nY tú, tú\nTú ya no eres igual\nNo me digas que sí\nNo sé lo que pensar\nNo sé lo que decir\nMejor será\nOlvidar tu amor\nSerá mejor\nTal vez, para los dos\nTal vez, para los dos\nMejor era cuando decías\nQue también me querías\nAhora todo pasó (ya)\nMejor era cuando pensabas\nQue me necesitabas\nAhora todo pasó (ya)\nY tú, tú\nTú ya no eres igual\nNo me digas que sí\nNo sé lo que pensar\nNo sé lo que decir\nNo sé lo que pensar\nNo sé lo que decir",
      "LOS LOCOS / NUBES DE TORMENTA": "Frente al espejo sonreí,\nno es tan difícil adivinar,\ntú volverás.\nLas horas huyen desde el reloj,\nse debaten lentas hasta morir,\nfuera de aquí, fuera de aquí. ¡Oh yeah!\n[Estribillo]\nHoy las nubes de tormenta van invadiendo el azul\n(van invadiendo el azul).\nSé que anuncian tu regreso,\nfin de la huida hacia el sur.\nLa la la la…\nLa la la la…\nLa la la la… la…\nBrotes de epidemia en el parque,\nprimavera negra para el jardín,\ntodo va mal.\nPérdidas notables de razón,\ninterés creciente horizontal,\nhacia el diván, hacia el diván. ¡Oh yeah!\nMis señales en la noche siguen su rastro de luz\n(siguen su rastro de luz).\nY me encontrarás dispuesto,\nson las costumbres del club.\n[Estribillo]\nHoy las nubes de tormenta van invadiendo el azul\n(van invadiendo el azul).\nSé que anuncian tu regreso,\nfin de la huida hacia el sur.\nLa la la la…\nLa la la la…\nLa la la la…\nOdias el calor, de otro país,\nhoy podrías regresar.\nLa la la la…"
};

    function irACanciones() {
      homeScreen.style.display = "none";
      songsScreen.style.display = "block";
      screen.style.display = "none";
    }

    function cargarCancion(nombre) {
      const texto = canciones[nombre] || "Letra no encontrada.";
      songsScreen.style.display = "none";
      homeScreen.style.display = "none";
      screen.style.display = "block";
      lyrics.textContent = texto;
      resetScroll();
    }

    function togglePlay() {
      playing = !playing;
    }

    function faster() {
      speed++;
      speedText.textContent = speed;
    }

    function slower() {
      if (speed > 1) {
        speed--;
        speedText.textContent = speed;
      }
    }

    function resetScroll() {
      playing = false;
      position = 0;
      lyrics.style.transform = "translateY(0px)";
    }

    function scrollText() {
      if (playing) {
        position -= speed * 0.35;
        lyrics.style.transform = `translateY(${position}px)`;
      }
      requestAnimationFrame(scrollText);
    }

    scrollText();
  </script>
</body>
</html>
